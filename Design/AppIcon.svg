<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- DashCast app icon: a car-dashboard display with a glowing play symbol. Original artwork. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151A1E"/>
      <stop offset="0.55" stop-color="#0A0D0F"/>
      <stop offset="1" stop-color="#040506"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="470" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1FE07A" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#14B85E" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0A5C2F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D2429"/>
      <stop offset="1" stop-color="#090C0E"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3CFF95" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9DFFC4"/>
      <stop offset="0.45" stop-color="#2BF07F"/>
      <stop offset="1" stop-color="#0BB653"/>
    </linearGradient>
    <linearGradient id="dash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20272C"/>
      <stop offset="1" stop-color="#07090A"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2BF07F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2BF07F" stop-opacity="1"/>
      <stop offset="1" stop-color="#2BF07F" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- background (omitted in the dark variant) -->
  <rect id="bg-fill" width="1024" height="1024" fill="url(#bg)"/>
  <rect id="bg-halo" width="1024" height="1024" fill="url(#halo)"/>

  <!-- display shadow -->
  <rect x="190" y="290" width="644" height="420" rx="78" fill="#000000" opacity="0.65" filter="url(#shadow)" transform="translate(0 26)"/>
  <!-- dashboard sweep (drawn under the display so the screen sits on it) -->
  <path d="M-20 1044 L-20 820 Q512 600 1044 820 L1044 1044 Z" fill="url(#dash)"/>
  <path d="M-20 820 Q512 600 1044 820" fill="none" stroke="url(#strip)" stroke-width="16" filter="url(#soft)"/>
  <path d="M-20 820 Q512 600 1044 820" fill="none" stroke="url(#strip)" stroke-width="4"/>

  <!-- display -->
  <rect x="190" y="268" width="644" height="420" rx="78" fill="url(#glass)"/>
  <rect x="190" y="268" width="644" height="420" rx="78" fill="url(#sheen)"/>
  <rect x="192" y="270" width="640" height="416" rx="76" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- play glyph with glow -->
  <path id="tri" d="M452 378 C452 354 477 340 498 352 L640 454 C658 467 658 489 640 502 L498 604 C477 616 452 602 452 578 Z"
        fill="#2BF07F" opacity="0.85" filter="url(#glow)"/>
  <path d="M452 378 C452 354 477 340 498 352 L640 454 C658 467 658 489 640 502 L498 604 C477 616 452 602 452 578 Z"
        fill="url(#play)"/>
  <path d="M462 384 C462 368 478 360 492 368 L560 417" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
</svg>
