name: DashCast CI

on:
  push:
    branches: [ main, 'claude/**', 'fix/**', 'feature/**', 'feat/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select newest Xcode (iOS 26 SDK)
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_[0-9]*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(rt,x) for rt,xs in d.items() if 'iOS' in rt for x in xs if x['name'].startswith('iPhone')]
          c.sort(key=lambda t:t[0])
          print(c[-1][1]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project DashCast.xcodeproj \
            -scheme DashCast \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)|TEST BUILD" || true
          grep -q "TEST BUILD SUCCEEDED\|BUILD SUCCEEDED" build.log

      - name: Warning summary
        if: always()
        run: |
          # Unique Swift warnings (xcodebuild repeats some per arch/target). Informational only.
          grep -E "\.swift:[0-9]+:[0-9]+: warning:" build.log | sed -E 's#^.*/DashCast/#DashCast/#' | sort -u > warnings.txt || true
          echo "Unique warnings: $(wc -l < warnings.txt)"
          echo "--- by category ---"
          awk '{ if ($0 ~ /is deprecated: renamed to/) c="deprecated design-token alias (dashX -> dcY)";
                 else if ($0 ~ /ThemeFonts.*deprecated/) c="deprecated ThemeFonts";
                 else if ($0 ~ /deprecated/) c="other deprecation";
                 else if ($0 ~ /[Ss]endable|actor|isolat|concurren/) c="concurrency";
                 else c="other"; n[c]++ } END { for (k in n) printf "%5d  %s\n", n[k], k }' warnings.txt | sort -rn
          echo "--- non-design-token warnings ---"
          grep -v "is deprecated: renamed to\|ThemeFonts" warnings.txt || true

      - name: Check CarPlay simulator entitlements
        run: |
          plutil -lint DashCast/DashCast-Simulator.entitlements DashCast/DashCast.entitlements
          xcodebuild -project DashCast.xcodeproj -target DashCast -sdk iphonesimulator -showBuildSettings 2>/dev/null \
            | grep -E '^ *CODE_SIGN_ENTITLEMENTS = DashCast/DashCast-Simulator.entitlements$'
          xcodebuild -project DashCast.xcodeproj -target DashCast -sdk iphoneos -showBuildSettings 2>/dev/null \
            | grep -E '^ *CODE_SIGN_ENTITLEMENTS = DashCast/DashCast.entitlements$'
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.carplay-video' DashCast/DashCast-Simulator.entitlements
          # Device/release entitlements must not claim CarPlay before Apple grants it.
          if grep -q 'com.apple.developer.carplay' DashCast/DashCast.entitlements; then
            echo "error: CarPlay key in device entitlements"; exit 1
          fi

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project DashCast.xcodeproj \
            -scheme DashCast \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -only-testing:DashCastTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|Test Case .* failed|Executed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST EXECUTE SUCCEEDED\|TEST SUCCEEDED" test.log

      - name: UI tests
        run: |
          set -o pipefail
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcodebuild test-without-building \
            -project DashCast.xcodeproj \
            -scheme DashCast \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/UITestResults.xcresult \
            -only-testing:DashCastUITests \
            CODE_SIGNING_ALLOWED=NO \
            | tee uitest.log | grep -E "error:|Test Case .* (passed|failed)|Executed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST EXECUTE SUCCEEDED\|TEST SUCCEEDED" uitest.log

      - name: Export UI test screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          if [ -d build/UITestResults.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path build/UITestResults.xcresult \
              --output-path build/screenshots || echo "attachment export failed"
            ls -la build/screenshots
          fi

      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: build/screenshots
          if-no-files-found: warn

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: |
            build.log
            test.log
            uitest.log
            build/TestResults.xcresult
            build/UITestResults.xcresult
          if-no-files-found: ignore
