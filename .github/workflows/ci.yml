name: DashCast CI

# CI runs exactly what a developer / Mac agent runs: Scripts/verify-all.sh
on:
  push:
    branches: [ main, 'claude/**', 'fix/**', 'feature/**', 'feat/**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify-all (build, unit, StoreKit, CarPlay, UI, coverage)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select newest Xcode (iOS 26 SDK)
        run: |
          XC=$(ls -d /Applications/Xcode_[0-9]*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Scripts/verify-all.sh
        env:
          FORCE_COLOR: "1"
        run: Scripts/verify-all.sh

      - name: Upload reports (junit, coverage, screenshots, logs, xcresult)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-all-reports
          path: build/reports
          if-no-files-found: warn

      - name: Publish JUnit results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: build/reports/junit/*.xml
          check_name: DashCast tests
          fail_on_failure: false
          require_tests: false
