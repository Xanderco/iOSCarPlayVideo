name: DashCast
options:
  bundleIdPrefix: com.xanderco
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_SYMBOL_GENERATION: YES

targets:
  DashCast:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DashCast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xanderco.dashcast
        PRODUCT_NAME: DashCast
        DEVELOPMENT_TEAM: "96YG38576A"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: DashCast/Info.plist
        CODE_SIGN_ENTITLEMENTS: DashCast/DashCast.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: DashCastBroadcast
      - target: DashCastCastWidget
      - target: DashCastWidgets

  # ReplayKit Broadcast Upload Extension: mirrors the screen to a parked car's browser.
  DashCastBroadcast:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DashCastBroadcast
      - path: DashCast/Features/Cast/Shared/CarCastShared.swift
      - path: DashCast/Features/Cast/Shared/MirrorFrameTransport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xanderco.dashcast.broadcast
        PRODUCT_NAME: DashCastBroadcast
        DEVELOPMENT_TEAM: "96YG38576A"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: DashCastBroadcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: DashCastBroadcast/DashCastBroadcast.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  # WidgetKit extension: Live Activity while DashCast is casting to a car display.
  DashCastCastWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DashCastCastWidget
      - path: DashCast/Features/Cast/Shared/CarCastActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xanderco.dashcast.castwidget
        PRODUCT_NAME: DashCastCastWidget
        DEVELOPMENT_TEAM: "96YG38576A"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: DashCastCastWidget/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  # WidgetKit extension: Home Screen + Lock Screen widgets (car, last trip, quick cast).
  DashCastWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DashCastWidgets
      - path: DashCast/Shared/WidgetSharedStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xanderco.dashcast.widgets
        PRODUCT_NAME: DashCastWidgets
        DEVELOPMENT_TEAM: "96YG38576A"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: DashCastWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: DashCastWidgets/DashCastWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  DashCastTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DashCastTests
      # Bundled so SKTestSession can load the local StoreKit catalogue in unit tests.
      - path: DashCast/Resources/DashCastStore.storekit
        buildPhase: resources
    dependencies:
      - target: DashCast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xanderco.dashcastTests
        GENERATE_INFOPLIST_FILE: YES

  DashCastUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DashCastUITests
    dependencies:
      - target: DashCast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xanderco.dashcastUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DashCast
        DEVELOPMENT_TEAM: "96YG38576A"

schemes:
  DashCast:
    build:
      targets:
        DashCast: all
        DashCastTests: [test]
        DashCastUITests: [test]
    test:
      config: Debug
      targets:
        - DashCastTests
        - DashCastUITests
    run:
      config: Debug
      storeKitConfiguration: DashCast/Resources/DashCastStore.storekit
