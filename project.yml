name: DashCast
options:
  bundleIdPrefix: com.xanderco
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_SYMBOL_GENERATION: YES

targets:
  DashCast:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DashCast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xanderco.dashcast
        PRODUCT_NAME: DashCast
        DEVELOPMENT_TEAM: "96YG38576A"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: DashCast/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DashCastTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DashCastTests
    dependencies:
      - target: DashCast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xanderco.dashcastTests
        GENERATE_INFOPLIST_FILE: YES

  DashCastUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DashCastUITests
    dependencies:
      - target: DashCast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xanderco.dashcastUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DashCast
        DEVELOPMENT_TEAM: "96YG38576A"

schemes:
  DashCast:
    build:
      targets:
        DashCast: all
        DashCastTests: [test]
        DashCastUITests: [test]
    test:
      config: Debug
      targets:
        - DashCastTests
        - DashCastUITests
    run:
      config: Debug
