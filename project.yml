name: DashCast
options:
  bundleIdPrefix: com.xanderco
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_SYMBOL_GENERATION: YES

targets:
  DashCast:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DashCast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xanderco.dashcast
        PRODUCT_NAME: DashCast
        DEVELOPMENT_TEAM: "96YG38576A"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: "DashCast"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: "YES"
        INFOPLIST_KEY_UIBackgroundModes: "audio,location"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "DashCast uses your location to track driving speed, trip stats, and street territory exploration."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "DashCast tracks your route and speed while driving to score your trips."
        INFOPLIST_KEY_NSMotionUsageDescription: "DashCast analyzes motion sensor data to detect smooth acceleration, braking, and cornering."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "DashCast accesses your photos so you can import personal videos and widget backgrounds."
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DashCastTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DashCastTests
    dependencies:
      - target: DashCast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xanderco.dashcastTests
        GENERATE_INFOPLIST_FILE: YES
